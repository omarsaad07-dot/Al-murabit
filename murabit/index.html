<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#070605">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="مُرابِط">
<title>مُرابِط</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=Amiri:wght@400;700&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A0907;--panel:#12100C;--line:#3A2F1F;--bronze:#6B5532;--gold:#D9B26F;--gold2:#F0D49A;--tan:#C9A86A;--text:#E8DCC2;--soft:#CFC3A8;--muted:#B8AA8E;--dim:#9A8F7A;--rust:#C0503A;--red:#6E1F16;--alert:#E8644A;--ok:#8FB07A}
*{box-sizing:border-box}
html,body{margin:0;background:#070605;color:var(--text);font-family:Cairo,sans-serif;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit;cursor:pointer}
a{color:var(--gold)}
#app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:calc(150px + env(safe-area-inset-bottom))}
.kufi{font-family:'Reem Kufi',sans-serif}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:18px 18px 12px;border-bottom:1px solid var(--line)}
.hdr h1{margin:0;font-family:'Reem Kufi',sans-serif;font-size:26px;color:var(--gold2)}
.hdr small{display:block;text-align:center;font-size:11px;color:var(--muted)}
.back{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border:1px solid var(--bronze);color:var(--gold);text-decoration:none}
.pad{padding:0 18px}
.card{background:var(--panel);border:1px solid var(--line);padding:14px}
.cut{clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px)}
.h2{margin:20px 18px 10px;font-family:'Reem Kufi',sans-serif;font-size:16px;font-weight:500;color:var(--tan)}
.p{margin:12px 18px 0;font-size:13px;line-height:1.7;color:var(--soft)}
.bar{height:12px;background:#1E1912;border:1px solid var(--bronze);padding:2px}
.bar>div{height:100%;background:linear-gradient(90deg,#8E2B1F,var(--tan))}
.big{display:flex;align-items:center;justify-content:center;gap:10px;height:60px;border:1px solid var(--gold);background:var(--red);color:#F6E7C8;font-family:'Reem Kufi',sans-serif;font-size:20px;font-weight:700;text-decoration:none;width:100%}
.big.calm{background:#3E3018}
.hex{clip-path:polygon(14px 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,14px 100%,0 50%)}
.row{display:flex;align-items:center;gap:12px;min-height:50px;padding:8px 12px;background:var(--panel);border:1px solid var(--line);text-align:right;width:100%;font-size:14px}
.row.on{border-color:var(--tan);background:#1E1810}
.chk{width:24px;height:24px;flex:none;border:1px solid var(--tan);display:flex;align-items:center;justify-content:center;font-weight:800;color:#0A0907}
.row.on .chk{background:var(--tan)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:40px;padding:0 12px;border:1px solid var(--line);background:transparent;font-size:13px}
.chip.on{border-color:var(--gold2);background:#221C12;color:var(--gold2);font-weight:700}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.muted{color:var(--muted)}
.foot{margin:22px 18px 8px;text-align:center;font-size:12px;color:var(--dim)}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:1px solid var(--line);background:#0E0C09;z-index:5;padding-bottom:env(safe-area-inset-bottom)}
nav a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 12px;text-decoration:none;color:var(--dim);font-size:12px;border-top:2px solid transparent}
nav a.on{color:var(--gold2);font-weight:700;border-top-color:var(--gold)}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#221C12;border:1px solid var(--gold);color:var(--gold2);padding:10px 18px;font-weight:700;z-index:9;font-size:14px;max-width:90%;text-align:center}
.heat{display:grid;grid-template-columns:56px repeat(7,minmax(0,1fr));gap:4px;align-items:center}
.heat span{font-size:10px;color:var(--muted);text-align:center}
.heat b{font-size:11px;font-weight:400;color:var(--soft)}
.heat i{height:26px;border:1px solid #2A231A;display:block}
.ic{object-fit:contain;display:block}.ic.rust{filter:sepia(1) saturate(3) hue-rotate(-30deg) brightness(.7) contrast(1.1)}
#intro{position:fixed;inset:0;z-index:20;background:#070605;display:flex;justify-content:center;transition:opacity .5s ease;cursor:pointer}
#intro .fr{position:relative;width:100%;max-width:480px;height:100%;overflow:hidden}
#intro .im{position:absolute;inset:0;background:#070605 center 22%/cover no-repeat}
#intro .sh{position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,6,5,.55) 0%,rgba(7,6,5,0) 30%,rgba(7,6,5,0) 55%,#070605 92%)}
#intro .lb{position:absolute;left:0;right:0;bottom:12%;text-align:center}
#intro .nm{font-family:'Reem Kufi',sans-serif;font-size:44px;font-weight:700;color:#F0D49A;line-height:1.2}
#intro .sb{font-size:14px;color:#B8AA8E;margin-top:4px;letter-spacing:1px}
#intro .ps{position:absolute;inset:0;background:#070605 center top/cover no-repeat;opacity:0;transform:scale(1.08);filter:brightness(.4);transition:opacity 1.6s ease,transform 3.4s cubic-bezier(.2,.7,.2,1),filter 2s ease;z-index:2}
#intro .ps.in{opacity:1;transform:scale(1);filter:brightness(1)}#intro .ps.out{opacity:0;transition:opacity .45s ease}
#intro canvas{position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none}
#intro .sk{z-index:4;position:absolute;top:14px;left:14px;min-height:40px;padding:0 14px;border:1px solid #3A2F1F;background:rgba(10,9,7,.6);color:#B8AA8E;font-size:12px}
@keyframes slam{0%{transform:scale(1.14);filter:brightness(2.4) saturate(.6)}100%{transform:scale(1);filter:brightness(1) saturate(1)}}
@keyframes land{0%{transform:scale(1.2);filter:brightness(3)}60%{transform:scale(.98);filter:brightness(1.1)}100%{transform:scale(1);filter:brightness(1)}}
@keyframes rise{0%{opacity:0;transform:translateY(12px)}100%{opacity:1;transform:none}}
#intro .slam{animation:slam .24s ease-out}
#intro .land{animation:land .7s cubic-bezier(.2,.8,.2,1)}
#intro .rise{animation:rise .5s ease-out both}
.pi{position:relative;display:inline-block;flex:none}.pi img{width:100%;height:100%;object-fit:contain;display:block}
.mk{position:absolute;inset:0;-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center}
.mk svg{width:100%;height:100%;display:block}
.shine{background:linear-gradient(110deg,transparent 30%,rgba(255,236,190,.75) 48%,transparent 62%);background-size:300% 100%;animation:sweep 2.8s ease-in-out infinite;mix-blend-mode:screen}
@keyframes sweep{0%{background-position:120% 0}60%,100%{background-position:-60% 0}}
.rustspots{background:radial-gradient(circle at 30% 35%,rgba(150,60,20,.85) 0 9%,transparent 16%),radial-gradient(circle at 68% 60%,rgba(120,45,15,.8) 0 7%,transparent 14%),radial-gradient(circle at 45% 78%,rgba(160,70,25,.7) 0 6%,transparent 12%),radial-gradient(circle at 75% 25%,rgba(110,40,12,.75) 0 5%,transparent 11%);mix-blend-mode:multiply}
.scrollwrap{margin:22px 12px 0;position:relative}
.roller{height:22px;margin:0 8px;border-radius:11px;position:relative;z-index:2;background:linear-gradient(180deg,#e2bd8c 0%,#b07f45 40%,#7a4b24 75%,#5a3418 100%);box-shadow:0 4px 8px rgba(0,0,0,.6)}
.roller::before,.roller::after{content:'';position:absolute;top:50%;width:22px;height:34px;transform:translateY(-50%);border-radius:45%;background:radial-gradient(ellipse at 40% 30%,#9a6a42,#5a3418 55%,#2e1a0b 100%);box-shadow:0 2px 4px rgba(0,0,0,.6)}
.roller::before{right:-14px}.roller::after{left:-14px}
.parch{margin:-8px 20px;padding:26px 18px 22px;position:relative;z-index:1;color:#3B2410;
background:radial-gradient(ellipse at 20% 15%,rgba(140,90,40,.18),transparent 40%),radial-gradient(ellipse at 80% 70%,rgba(120,70,25,.2),transparent 45%),radial-gradient(ellipse at 50% 50%,#E3C79A 0%,#D6B47F 60%,#C49A62 100%);
box-shadow:inset 0 0 50px rgba(95,55,15,.55),inset 0 0 8px rgba(70,40,10,.6);clip-path:polygon(99.3% 0.0%,99.7% 5.6%,98.6% 11.1%,99.8% 16.7%,98.8% 22.2%,99.2% 27.8%,99.9% 33.3%,98.9% 38.9%,99.9% 44.4%,99.0% 50.0%,99.8% 55.6%,99.8% 61.1%,99.1% 66.7%,98.2% 72.2%,99.7% 77.8%,99.5% 83.3%,98.6% 88.9%,97.9% 94.4%,98.7% 100.0%,0.9% 100.0%,2.1% 94.4%,0.1% 88.9%,1.9% 83.3%,0.6% 77.8%,0.3% 72.2%,0.3% 66.7%,0.7% 61.1%,1.8% 55.6%,0.4% 50.0%,1.3% 44.4%,1.4% 38.9%,0.8% 33.3%,1.2% 27.8%,0.1% 22.2%,0.1% 16.7%,0.5% 11.1%,1.5% 5.6%,0.9% 0.0%)}
.parch .ptitle{margin:0 0 10px;text-align:center;font-family:'Reem Kufi',sans-serif;font-size:22px;font-weight:700;color:#4A2A10}
.parch .row{background:transparent;border:0;border-bottom:1px dashed rgba(90,55,25,.4);color:#3B2410;min-height:46px;font-weight:600}
.parch .row:last-child{border-bottom:0}
.parch .row.on{background:rgba(110,65,20,.10)}
.parch .row.on span:last-child{color:#6B4A2A}
.parch .chk{border:1.5px solid #6B4423;color:#F3E3C3;background:transparent}
.parch .row.on .chk{background:#6B4423}
.rowwrap{display:flex;align-items:stretch;gap:8px}.rowwrap .row{flex:1}
.readbtn{flex:none;display:flex;align-items:center;justify-content:center;min-width:64px;min-height:44px;padding:0 10px;border:1px solid var(--gold);color:var(--gold2);background:#221C12;text-decoration:none;font-size:13px;font-weight:700}
.parch .rowwrap{border-bottom:1px dashed rgba(90,55,25,.4)}.parch .rowwrap .row{border-bottom:0}
.parch .readbtn{background:#6B4423;border-color:#4A2A10;color:#F3E3C3;margin:6px 0}
.sync{font-size:10px;color:var(--dim);text-align:center;margin-top:6px}
</style>
</head>
<body>
<div id="app"></div>
<script>

    <div style="display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;margin-top:10px">${ps.list.map(p => `<div style="text-align:center;padding:8px 0;border:1px solid ${p.open && !p.done ? 'var(--gold)' : p.missed ? '#8E2B1F' : 'var(--line)'};background:${p.done ? '#1E1810' : 'transparent'}"><div style="font-size:12px;font-weight:700;color:${p.done ? 'var(--gold2)' : p.missed ? 'var(--rust)' : 'var(--text)'}">${p.n}</div><div style="font-size:11px" class="muted">${fmtT(p.at)}</div><div style="font-size:10px;font-weight:700;color:${p.done ? 'var(--tan)' : p.missed ? 'var(--rust)' : 'var(--dim)'}">${p.done ? '✓ أُدّيت' : p.missed ? 'فاتت' : p.open ? 'وقتها الآن' : '—'}</div></div>`).join('')}</div>
  </section>`;
}

/* ---------- adhkar (Hisn al-Muslim) ---------- */
const BASMALA = 'بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ';
const ADHKAR_COMMON = [
  { t: 'أَعُوذُ بِاللَّهِ مِنَ الشَّيْطَانِ الرَّجِيمِ — اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ ۚ لَّهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ ۗ مَن ذَا الَّذِي يَشْفَعُ عِندَهُ إِلَّا بِإِذْنِهِ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَيْءٍ مِّنْ عِلْمِهِ إِلَّا بِمَا شَاءَ ۚ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ ۖ وَلَا يَئُودُهُ حِفْظُهُمَا ۚ وَهُوَ الْعَلِيُّ الْعَظِيمُ', n: 1, src: 'آية الكرسي' },
  { t: BASMALA + ' — قُلْ هُوَ اللَّهُ أَحَدٌ ۝ اللَّهُ الصَّمَدُ ۝ لَمْ يَلِدْ وَلَمْ يُولَدْ ۝ وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ', n: 3, src: 'سورة الإخلاص' },
  { t: BASMALA + ' — قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ ۝ مِن شَرِّ مَا خَلَقَ ۝ وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ ۝ وَمِن شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ ۝ وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ', n: 3, src: 'سورة الفلق' },
  { t: BASMALA + ' — قُلْ أَعُوذُ بِرَبِّ النَّاسِ ۝ مَلِكِ النَّاسِ ۝ إِلَٰهِ النَّاسِ ۝ مِن شَرِّ الْوَسْوَاسِ الْخَنَّاسِ ۝ الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ ۝ مِنَ الْجِنَّةِ وَالنَّاسِ', n: 3, src: 'سورة الناس' }
];
const ADHKAR = {
  am: { title: 'أذكار الصباح', items: ADHKAR_COMMON.concat([
    { t: 'أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، رَبِّ أَسْأَلُكَ خَيْرَ مَا فِي هَذَا الْيَوْمِ وَخَيْرَ مَا بَعْدَهُ، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِي هَذَا الْيَوْمِ وَشَرِّ مَا بَعْدَهُ، رَبِّ أَعُوذُ بِكَ مِنَ الْكَسَلِ وَسُوءِ الْكِبَرِ، رَبِّ أَعُوذُ بِكَ مِنْ عَذَابٍ فِي النَّارِ وَعَذَابٍ فِي الْقَبْرِ', n: 1 },
    { t: 'اللَّهُمَّ بِكَ أَصْبَحْنَا، وَبِكَ أَمْسَيْنَا، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ، وَإِلَيْكَ النُّشُورُ', n: 1 }
  ]) },
  pm: { title: 'أذكار المساء', items: ADHKAR_COMMON.concat([
    { t: 'أَمْسَيْنَا وَأَمْسَى الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، رَبِّ أَسْأَلُكَ خَيْرَ مَا فِي هَذِهِ اللَّيْلَةِ وَخَيْرَ مَا بَعْدَهَا، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِي هَذِهِ اللَّيْلَةِ وَشَرِّ مَا بَعْدَهَا، رَبِّ أَعُوذُ بِكَ مِنَ الْكَسَلِ وَسُوءِ الْكِبَرِ، رَبِّ أَعُوذُ بِكَ مِنْ عَذَابٍ فِي النَّارِ وَعَذَابٍ فِي الْقَبْرِ', n: 1 },
    { t: 'اللَّهُمَّ بِكَ أَمْسَيْنَا، وَبِكَ أَصْبَحْنَا، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ، وَإِلَيْكَ الْمَصِيرُ', n: 1 }
  ]) }
};
const ADHKAR_TAIL = [
  { t: 'اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ بِذَنْبِي فَاغْفِرْ لِي فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ', n: 1, src: 'سيّد الاستغفار' },
  { t: 'اللَّهُمَّ عَافِنِي فِي بَدَنِي، اللَّهُمَّ عَافِنِي فِي سَمْعِي، اللَّهُمَّ عَافِنِي فِي بَصَرِي، لَا إِلَهَ إِلَّا أَنْتَ', n: 3 },
  { t: 'بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ', n: 3 },
  { t: 'رَضِيتُ بِاللَّهِ رَبًّا، وَبِالْإِسْلَامِ دِينًا، وَبِمُحَمَّدٍ ﷺ نَبِيًّا', n: 3 },
  { t: 'يَا حَيُّ يَا قَيُّومُ بِرَحْمَتِكَ أَسْتَغِيثُ، أَصْلِحْ لِي شَأْنِي كُلَّهُ، وَلَا تَكِلْنِي إِلَى نَفْسِي طَرْفَةَ عَيْنٍ', n: 1 },
  { t: 'حَسْبِيَ اللَّهُ لَا إِلَهَ إِلَّا هُوَ، عَلَيْهِ تَوَكَّلْتُ، وَهُوَ رَبُّ الْعَرْشِ الْعَظِيمِ', n: 7 },
  { t: 'لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ', n: 10 },
  { t: 'سُبْحَانَ اللَّهِ وَبِحَمْدِهِ', n: 100 }
];
ADHKAR.am.items = ADHKAR.am.items.concat(ADHKAR_TAIL);
ADHKAR.pm.items = ADHKAR.pm.items.concat([{ t: 'أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ', n: 3 }]).concat(ADHKAR_TAIL);
